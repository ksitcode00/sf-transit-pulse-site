name: Verify application contracts

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API and test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt duckdb httpx pytest requests gtfs-realtime-bindings

      - name: Verify planner and API contracts
        run: python -m pytest -q tests

      - name: Verify browser JavaScript
        run: |
          node --check site/app.js
          node --check site/analytics/analytics.js
          node --check site/nearby-stops.js
          node --check site/place-search.js
          node --check site/stop-catalog.js
          node --check site/planner-worker.js
          node --check site/planner-engine.mjs
          node --check cloudflare/refresh-watchdog/worker.js

      - name: Verify Scheme B browser planner contracts
        run: node --test tests/browser-planner.test.mjs tests/nearby-stops.test.cjs tests/place-search.test.cjs tests/stop-catalog.test.cjs tests/refresh-watchdog.test.mjs tests/analytics.test.cjs

      - name: Verify public JSON caches
        run: |
          python -m json.tool site/data/network.json > /dev/null
          python -m json.tool site/data/latest.json > /dev/null
          python -m json.tool site/data/live-transit.json > /dev/null
          python -m json.tool site/data/alerts-roads.json > /dev/null
          python -m json.tool site/data/parking-context.json > /dev/null
          python -m json.tool site/data/safety-context.json > /dev/null
          python -m json.tool site/data/refresh-health.json > /dev/null
          python -m json.tool site/data/eta-analytics.json > /dev/null
          python -m json.tool site/data/historical-analytics.json > /dev/null
          python -m json.tool site/data/construction-exposure.json > /dev/null
          python -m json.tool site/data/service-alert-history.json > /dev/null
