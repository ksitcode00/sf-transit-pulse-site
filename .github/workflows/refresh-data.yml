name: Refresh transit snapshot

on:
  push:
    # Run one full integration refresh whenever this workflow's data contract changes.
    paths:
      - ".github/workflows/refresh-data.yml"
      - "scripts/refresh_data.py"
  schedule:
    # One off-peak cron entry is less likely to be dropped than overlapping
    # schedules. The script decides which slower-changing sources are due.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-transit-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests gtfs-realtime-bindings

      - name: Build credential-free public snapshot
        env:
          SF_TRANSIT_511_API_KEY: ${{ secrets.SF_TRANSIT_511_API_KEY }}
          SF_TRANSIT_FORCE_CONTEXT: ${{ github.event_name != 'schedule' }}
        run: python scripts/refresh_data.py

      - name: Commit changed snapshot
        run: |
          git config user.name "sf-transit-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json site/data/live-transit.json site/data/alerts-roads.json
          git add site/data/parking-context.json site/data/safety-context.json site/data/network.json
          if [ -f data/parking-inventory.json ]; then
            git add data/parking-inventory.json
          fi
          if [ -f data/static-index.json ]; then
            git add data/static-index.json
          fi
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged."
          else
            git commit -m "data: refresh public transit snapshot"
            git push
          fi
