name: Refresh transit snapshot

on:
  push:
    # Run one full integration refresh whenever this workflow's data contract changes.
    paths:
      - ".github/workflows/refresh-data.yml"
      - "scripts/refresh_data.py"
  schedule:
    # Context run: vehicles + trip updates + alerts + road events.
    - cron: "3,18,33,48 * * * *"
    # Core run: vehicles + trip updates only. Together these run every 5 min.
    - cron: "8,13,23,28,38,43,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-transit-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests gtfs-realtime-bindings

      - name: Build credential-free public snapshot
        env:
          SF_TRANSIT_511_API_KEY: ${{ secrets.SF_TRANSIT_511_API_KEY }}
          SF_TRANSIT_REFRESH_CONTEXT: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '3,18,33,48 * * * *' }}
        run: python scripts/refresh_data.py

      - name: Commit changed snapshot
        run: |
          git config user.name "sf-transit-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json site/data/network.json
          if [ -f site/data/parking-inventory.json ]; then
            git add site/data/parking-inventory.json
          fi
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged."
          else
            git commit -m "data: refresh public transit snapshot"
            git push
          fi
