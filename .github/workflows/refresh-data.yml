name: Refresh transit snapshot

on:
  push:
    # Run one full integration refresh whenever this workflow's data contract changes.
    # Tags must not trigger this job: a tag checkout has a detached HEAD and cannot
    # safely publish the generated snapshot back to the main branch.
    branches:
      - main
    paths:
      - ".github/workflows/refresh-data.yml"
      - "scripts/refresh_data.py"
  schedule:
    # GitHub's documented minimum schedule is five minutes. Cloudflare supplies
    # the three-minute primary clock; this remains a quota-gated fallback.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      force_context:
        description: "Also refresh 15-minute and slower context sources"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sf-transit-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Avoid duplicate quota spend
        id: refresh_gate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif python scripts/check_refresh_due.py --minimum-age-seconds 120; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.refresh_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        if: steps.refresh_gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check requests gtfs-realtime-bindings

      - name: Build credential-free public snapshot
        if: steps.refresh_gate.outputs.run == 'true'
        env:
          SF_TRANSIT_511_API_KEY: ${{ secrets.SF_TRANSIT_511_API_KEY }}
          SF_TRANSIT_DATASF_APP_TOKEN: ${{ secrets.SF_TRANSIT_DATASF_APP_TOKEN }}
          # External watchdog dispatches must follow normal source intervals.
          # Only a data-contract push or an explicit operator choice forces context.
          SF_TRANSIT_FORCE_CONTEXT: ${{ github.event_name == 'push' || inputs.force_context == true }}
        run: python scripts/refresh_data.py

      - name: Commit changed snapshot
        if: steps.refresh_gate.outputs.run == 'true'
        run: |
          git config user.name "sf-transit-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json site/data/live-transit.json site/data/alerts-roads.json
          git add site/data/parking-context.json site/data/safety-context.json site/data/network.json
          git add site/data/refresh-health.json
          if [ -f data/parking-inventory.json ]; then
            git add data/parking-inventory.json
          fi
          if [ -f data/static-index.json ]; then
            git add data/static-index.json
          fi
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged."
          else
            git commit -m "data: refresh public transit snapshot"
            # A person can push a UI change while this job is collecting data.
            # Retry a normal fetch/rebase/push sequence so that harmless timing
            # races do not turn a successfully-built snapshot into a failed run.
            # Never force-push: data automation must not overwrite user work.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push race on attempt ${attempt}; synchronizing and retrying."
            done
            exit 1
          fi
