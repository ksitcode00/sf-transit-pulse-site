name: Refresh transit snapshot

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-transit-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests gtfs-realtime-bindings

      - name: Build credential-free public snapshot
        env:
          SF_TRANSIT_511_API_KEY: ${{ secrets.SF_TRANSIT_511_API_KEY }}
        run: python scripts/refresh_data.py

      - name: Commit changed snapshot
        run: |
          git config user.name "sf-transit-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json site/data/network.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged."
          else
            git commit -m "data: refresh public transit snapshot"
            git push
          fi
