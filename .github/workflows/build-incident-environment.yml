name: Build incident environment history

on:
  workflow_dispatch:
  schedule:
    # Cloudflare is the independent primary timer; GitHub provides fallback.
    - cron: "53 13 * * *"

permissions:
  contents: write

concurrency:
  group: sf-transit-incident-environment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Avoid duplicate daily downloads
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('site/data/incident-environment.json')
          age = float('inf')
          if path.exists():
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(json.loads(path.read_text())['generated_at'])).total_seconds()
          run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or age > 20 * 3600
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'run={str(run).lower()}\n')
          PY
      - name: Install data dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check requests
      - name: Download official reports and match stop areas
        if: steps.gate.outputs.run == 'true'
        env:
          SF_TRANSIT_DATASF_APP_TOKEN: ${{ secrets.SF_TRANSIT_DATASF_APP_TOKEN }}
        run: python scripts/prepare_incident_environment.py
      - name: Publish valid incident history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "sf-transit-data-bot"
          git config user.email "sf-transit-data-bot@users.noreply.github.com"
          git add site/data/incident-environment.json site/data/tableau/feature8_incident_environment.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: update incident environment history"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
