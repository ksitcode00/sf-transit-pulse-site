name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Commits created with the repository GITHUB_TOKEN do not emit another
  # push workflow event. Listen for the refresh workflow itself so every
  # successful scheduled snapshot is published to Pages.
  workflow_run:
    workflows: ["Refresh transit snapshot", "Refresh static transit network", "Build Tableau historical data", "Build Feature 5 Tableau data", "Build traffic safety history", "Build incident environment history"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A rapid data refresh must not cancel a user-facing site release. Data
  # deployments may supersede each other; a code/site deployment gets its own
  # queue and therefore always reaches Pages.
  group: pages-${{ github.event_name == 'push' && 'site' || 'data' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # GitHub's artifact service can intermittently reject FinalizeArtifact
      # with a 403 after the bytes were uploaded. Use a distinct artifact name
      # for the retry: artifact names are immutable within a workflow run.
      - name: Upload static site
        id: upload_primary
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: site

      - name: Back off after artifact upload failure
        if: ${{ steps.upload_primary.outcome == 'failure' }}
        run: sleep 15

      - name: Retry static site upload
        id: upload_retry
        if: ${{ steps.upload_primary.outcome == 'failure' }}
        continue-on-error: false
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-retry
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ steps.upload_primary.outcome == 'success' && 'github-pages' || 'github-pages-retry' }}
