name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Commits created with the repository GITHUB_TOKEN do not emit another
  # push workflow event. Listen for the refresh workflow itself so every
  # successful scheduled snapshot is published to Pages.
  workflow_run:
    workflows: ["Refresh transit snapshot", "Refresh static transit network", "Build Tableau historical data", "Build Feature 5 Tableau data", "Build traffic safety history"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A rapid data refresh must not cancel a user-facing site release. Data
  # deployments may supersede each other; a code/site deployment gets its own
  # queue and therefore always reaches Pages.
  group: pages-${{ github.event_name == 'push' && 'site' || 'data' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
