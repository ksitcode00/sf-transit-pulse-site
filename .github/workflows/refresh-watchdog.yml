name: Recover stale transit snapshot

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sf-transit-data-refresh
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check snapshot age
        id: freshness
        continue-on-error: true
        run: python scripts/check_refresh_health.py --max-age-min 7

      - name: Install refresh dependencies
        if: steps.freshness.outcome == 'failure'
        run: python -m pip install --disable-pip-version-check requests gtfs-realtime-bindings

      - name: Recover stale snapshot
        if: steps.freshness.outcome == 'failure'
        env:
          SF_TRANSIT_511_API_KEY: ${{ secrets.SF_TRANSIT_511_API_KEY }}
          SF_TRANSIT_DATASF_APP_TOKEN: ${{ secrets.SF_TRANSIT_DATASF_APP_TOKEN }}
        run: python scripts/refresh_data.py

      - name: Verify recovered source time
        if: steps.freshness.outcome == 'failure'
        run: python scripts/check_refresh_health.py --max-age-min 7

      - name: Commit recovered snapshot
        id: commit
        if: steps.freshness.outcome == 'failure'
        run: |
          git config user.name "sf-transit-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json site/data/live-transit.json site/data/alerts-roads.json
          git add site/data/parking-context.json site/data/safety-context.json site/data/refresh-health.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: recover stale transit snapshot"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish recovered data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml
