name: Refresh static transit network

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-transit-data-refresh
  cancel-in-progress: false

jobs:
  refresh-static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check requests gtfs-realtime-bindings

      - name: Refresh static GTFS and routing index
        env:
          SF_TRANSIT_511_API_KEY: ${{ secrets.SF_TRANSIT_511_API_KEY }}
          SF_TRANSIT_STATIC_ONLY: "true"
        run: python scripts/refresh_data.py

      - name: Commit changed static network
        run: |
          git config user.name "sf-transit-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/network.json data/static-index.json
          if git diff --cached --quiet; then
            echo "Static network is unchanged."
          else
            git commit -m "data: refresh static transit network"
            git push
          fi
