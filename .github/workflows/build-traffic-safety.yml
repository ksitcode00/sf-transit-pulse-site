name: Build traffic safety history

on:
  workflow_dispatch:
  schedule:
    # Weekly fallback; Cloudflare provides an independent primary trigger.
    - cron: "37 13 * * 5"

permissions:
  contents: write

concurrency:
  group: sf-transit-traffic-safety
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Avoid duplicate weekly downloads
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('site/data/traffic-safety.json')
          age = float('inf')
          if path.exists():
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(json.loads(path.read_text())['generated_at'])).total_seconds()
          run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or age > 6 * 86400
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'run={str(run).lower()}\n')
          PY
      - name: Install data dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check requests
      - name: Download official crashes and match Muni corridors
        if: steps.gate.outputs.run == 'true'
        env:
          SF_TRANSIT_DATASF_APP_TOKEN: ${{ secrets.SF_TRANSIT_DATASF_APP_TOKEN }}
        run: python scripts/prepare_traffic_safety.py
      - name: Publish last valid crash history
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "sf-transit-data-bot"
          git config user.email "sf-transit-data-bot@users.noreply.github.com"
          git add site/data/traffic-safety.json site/data/tableau/feature7_traffic_safety.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: update traffic safety history"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
