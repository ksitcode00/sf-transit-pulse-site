name: Export Tableau ETA snapshots

on:
  schedule:
    # 03:15 or 04:15 San Francisco time, after the prior service day is complete.
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      service_date:
        description: "Optional San Francisco service date in YYYY-MM-DD; blank exports yesterday"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sf-transit-eta-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete prediction history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Parquet writer
        run: python -m pip install pyarrow

      - name: Resolve San Francisco service date
        id: period
        env:
          INPUT_SERVICE_DATE: ${{ inputs.service_date }}
        run: |
          python - <<'PY'
          import datetime
          import os
          from zoneinfo import ZoneInfo

          service_date = os.environ.get("INPUT_SERVICE_DATE", "").strip()
          if not service_date:
              service_date = str(
                  datetime.datetime.now(ZoneInfo("America/Los_Angeles")).date()
                  - datetime.timedelta(days=1)
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"service_date={service_date}\n")
          PY

      - name: Export immutable prediction snapshots
        run: >-
          python scripts/export_eta_snapshots.py
          --service-date "${{ steps.period.outputs.service_date }}"
          --output-dir eta-output

      - name: Upload Tableau-ready daily prediction archive
        uses: actions/upload-artifact@v4
        with:
          name: sf-transit-eta-snapshots-${{ steps.period.outputs.service_date }}
          path: eta-output/
          if-no-files-found: error
          # Official stop observations arrive later in the monthly historic feed.
          # Keep raw predictions long enough to match them, then let artifacts expire.
          retention-days: 60
          compression-level: 0
