name: Build Tableau historical data

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Complete historic month in YYYY-MM format"
        required: true
        default: "2026-08"
        type: string

permissions:
  contents: read

concurrency:
  group: sf-transit-tableau-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-processing dependency
        run: python -m pip install --disable-pip-version-check duckdb

      - name: Restore monthly historic feed cache
        id: historic_cache
        uses: actions/cache/restore@v4
        with:
          path: .tableau-history-work/regional-${{ inputs.month }}-so.zip
          key: 511-historic-regional-${{ inputs.month }}-so-v1

      - name: Build Tableau-ready historical tables
        env:
          SF_TRANSIT_511_API_KEY: ${{ secrets.SF_TRANSIT_511_API_KEY }}
        run: >-
          python scripts/prepare_tableau_history.py
          --month "${{ inputs.month }}"
          --output-dir tableau-output

      - name: Save monthly historic feed cache
        if: always() && steps.historic_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tableau-history-work/regional-${{ inputs.month }}-so.zip
          key: 511-historic-regional-${{ inputs.month }}-so-v1

      - name: Upload processed CSV files
        uses: actions/upload-artifact@v4
        with:
          name: sf-transit-tableau-${{ inputs.month }}
          path: tableau-output/
          if-no-files-found: error
          retention-days: 14
