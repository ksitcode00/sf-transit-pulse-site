services:
  - type: web
    name: sf-transit-planner-api-ksitcode00
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: SF_TRANSIT_ALLOWED_ORIGINS
        value: https://ksitcode00.github.io,http://127.0.0.1:8765,http://localhost:8765
      - key: SF_TRANSIT_NETWORK_SOURCE
        value: https://ksitcode00.github.io/sf-transit-pulse-site/data/network.json
      - key: SF_TRANSIT_REALTIME_SOURCE
        value: https://ksitcode00.github.io/sf-transit-pulse-site/data/latest.json
